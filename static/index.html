<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#090d16">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mini IDM">
  <link rel="manifest" href="/manifest.json">
  <title>Mini IDM Mobile</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background: #090d16;
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-top: env(safe-area-inset-top, 14px);
      padding-bottom: env(safe-area-inset-bottom, 20px);
    }
    .container {
      max-width: 480px;
      width: 100%;
      margin: 0 auto;
      padding: 16px 18px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 18px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-icon {
      width: 42px;
      height: 42px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6, #a855f7);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 16px rgba(124, 58, 237, 0.45);
      flex-shrink: 0;
    }
    .brand-icon svg {
      width: 22px;
      height: 22px;
      fill: #ffffff;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
    }
    .brand-text h1 {
      font-size: 21px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #ffffff;
      line-height: 1.15;
    }
    .brand-text span {
      color: #60a5fa;
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      display: block;
      margin-top: 2px;
    }
    .status-badge {
      font-size: 11.5px;
      font-weight: 500;
      background: rgba(16, 185, 129, 0.12);
      color: #34d399;
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid rgba(16, 185, 129, 0.28);
      display: flex;
      align-items: center;
      gap: 7px;
      letter-spacing: 0.2px;
    }
    .dot {
      width: 8px;
      height: 8px;
      background: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 8px #10b981;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(0.9); }
    }

    /* Platform Chips Row */
    .platforms {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      padding-bottom: 14px;
    }
    .plat-chip {
      background: #111a2d;
      padding: 5px 8px;
      border-radius: 9px;
      font-size: 11px;
      font-weight: 500;
      color: #94a3b8;
      border: 1px solid rgba(255, 255, 255, 0.07);
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      user-select: none;
    }
    .plat-chip svg {
      width: 12px;
      height: 12px;
      flex-shrink: 0;
      border-radius: 2px;
    }
      border-radius: 3px;
    }
    .plat-chip.active {
      background: rgba(99, 102, 241, 0.22);
      color: #ffffff;
      border-color: #818cf8;
      box-shadow: 0 0 14px rgba(99, 102, 241, 0.35);
      font-weight: 600;
    }
    .plat-chip:active {
      transform: scale(0.95);
    }

    /* Main Card */
    .card {
      background: #111927;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 18px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      margin-bottom: 0;
    }
    .input-wrapper {
      position: relative;
      margin-bottom: 16px;
    }
    .input-wrapper input {
      width: 100%;
      background: #090f19;
      border: 1.5px solid #1f2c42;
      border-radius: 14px;
      padding: 14px 84px 14px 16px;
      color: #ffffff;
      font-size: 14.5px;
      outline: none;
      transition: all 0.2s ease;
    }
    .input-wrapper input::placeholder {
      color: #64748b;
      font-size: 13.5px;
    }
    .input-wrapper input:focus {
      border-color: #818cf8;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
    }
    .btn-paste {
      position: absolute;
      right: 7px;
      top: 50%;
      transform: translateY(-50%);
      background: #1e2a3f;
      border: 1px solid rgba(255, 255, 255, 0.06);
      color: #cbd5e1;
      padding: 7px 11px;
      border-radius: 9px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s ease;
    }
    .btn-paste:active {
      background: #2d3e5e;
      transform: translateY(-50%) scale(0.95);
    }

    /* Format Selection */
    .section-title {
      font-size: 11.5px;
      color: #94a3b8;
      font-weight: 700;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }
    .formats {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 9px;
      margin-bottom: 18px;
    }
    .format-btn {
      background: #090f19;
      border: 1.5px solid #1f2c42;
      border-radius: 13px;
      padding: 11px 6px;
      color: #cbd5e1;
      font-size: 12.5px;
      font-weight: 700;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .format-btn span {
      display: block;
      font-size: 10px;
      color: #64748b;
      font-weight: normal;
      margin-top: 3px;
      letter-spacing: -0.1px;
    }
    .format-btn.active {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.22), rgba(168, 85, 247, 0.22));
      border-color: #818cf8;
      color: #ffffff;
      box-shadow: 0 0 12px rgba(99, 102, 241, 0.25);
    }
    .format-btn.active span {
      color: #c7d2fe;
    }

    /* Big Download Button */
    .btn-download {
      width: 100%;
      background: linear-gradient(135deg, #6366f1, #8b5cf6, #a855f7);
      color: #ffffff;
      border: none;
      border-radius: 15px;
      padding: 16px;
      font-size: 15.5px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 6px 20px rgba(124, 58, 237, 0.4);
      transition: transform 0.1s, opacity 0.2s, box-shadow 0.2s;
    }
    .btn-download:active {
      transform: scale(0.98);
      opacity: 0.92;
    }
    .btn-download:disabled {
      background: #1e293b;
      color: #64748b;
      box-shadow: none;
      cursor: not-allowed;
    }

    /* Live Progress Card */
    .progress-card {
      background: #0b111e;
      border: 1px solid #1f2c42;
      border-radius: 14px;
      padding: 14px;
      margin-top: 14px;
      display: none;
    }
    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .progress-title {
      font-size: 13.5px;
      font-weight: 600;
      color: #f1f5f9;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 230px;
    }
    .progress-pct {
      font-size: 13.5px;
      font-weight: 700;
      color: #818cf8;
    }
    .progress-bar-bg {
      width: 100%;
      height: 7px;
      background: #172033;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 8px;
    }
    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #6366f1, #10b981);
      border-radius: 4px;
      transition: width 0.3s ease;
    }
    .progress-footer {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #94a3b8;
    }
    .btn-save-phone {
      margin-top: 12px;
      width: 100%;
      background: #10b981;
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 13px;
      font-size: 14.5px;
      font-weight: 700;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.4);
      text-decoration: none;
    }
    .btn-save-phone:active {
      transform: scale(0.98);
    }


  </style>
</head>
<body>
  <div class="container">
    <!-- Top Header -->

      <div class="brand">

        </svg>
        <span>TikTok</span>
      </div>

      <!-- FB Reels -->
      <div class="plat-chip" id="chip-fb">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="12" fill="#1877F2"/>
          <path d="M14.7 13.5l.5-3.3h-3.2v-2.1c0-.9.3-1.6 1.6-1.6h1.7V3.6c-.3 0-1.3-.1-2.5-.1-2.5 0-4.1 1.5-4.1 4.3v2.4H5.8v3.3h2.9V21.6c.6.1 1.2.2 1.8.2s1.2-.1 1.8-.2V13.5h2.4z" fill="#FFFFFF"/>
        </svg>
        <span>FB Reels</span>
      </div>

      <!-- Instagram -->
      <div class="plat-chip" id="chip-ig">
        <svg viewBox="0 0 24 24">
          <defs>
            <radialGradient id="igRad" cx="20%" cy="105%" r="130%">
              <stop offset="0%" stop-color="#FFD600"/>
              <stop offset="30%" stop-color="#FF7A00"/>
              <stop offset="60%" stop-color="#FF0069"/>

          </defs>

      </div>

      <!-- YouTube -->
      <div class="plat-chip" id="chip-yt">
        <svg viewBox="0 0 24 24">
          <rect width="24" height="24" rx="5" fill="#FF0000"/>
          <polygon points="10,7 16.5,12 10,17" fill="#FFFFFF"/>
        </svg>
        <span>YouTube</span>
      </div>

      <!-- Threads -->
      <div class="plat-chip" id="chip-threads">
        <svg viewBox="0 0 24 24" fill="none">
          <rect width="24" height="24" rx="6" fill="#1e293b"/>
          <path d="M17.5 11.2c-.1-.1-.2-.1-.3-.2-.1-2.4-1.5-3.8-3.7-3.8-.1 0-.2 0-.2 0-1.9 0-3.4 1.1-3.8 3-.5 2.2.4 4.4 2.3 5.5.9.5 1.9.8 2.9.8 1.3 0 2.5-.4 3.5-1.2.2-.2.2-.5 0-.7-.2-.2-.5-.2-.7 0-.8.7-1.8 1.1-2.8 1.1-.8 0-1.6-.2-2.3-.7-1.6-.9-2.3-2.8-1.9-4.5.4-1.6 1.6-2.5 2.9-2.5h.2c1.7 0 2.7 1.1 2.8 3-.6-.2-1.2-.2-1.9-.2-2.3 0-3.6 1.2-3.6 2.7 0 1.3 1 2.2 2.4 2.2 1.1 0 2-.5 2.7-1.5.5.9 1.3 1.4 2.3 1.6.3 0 .5-.2.5-.5 0-.3-.2-.5-.5-.5-.8-.1-1.5-.6-1.9-1.3.4-.7.7-1.6.8-2.1zm-2.9.2c.5 0 1 .1 1.4.2-.2 1.3-.9 2.5-2.6 2.5-.9 0-1.5-.6-1.5-1.4 0-1 1-1.3 2.7-1.3z" fill="#FFFFFF"/>
        </svg>
        <span>Threads</span>
      </div>

      <!-- Shopee -->
      <div class="plat-chip" id="chip-shopee">
        <svg viewBox="0 0 24 24" fill="none">
          <rect width="24" height="24" rx="5" fill="#EE4D2D"/>
          <path d="M18.5 8h-2.5v-.8c0-2.2-1.8-4-4-4s-4 1.8-4 4V8H5.5c-.8 0-1.5.7-1.5 1.5l1 10c.1.8.8 1.5 1.6 1.5h10.8c.8 0 1.5-.7 1.6-1.5l1-10c0-.8-.7-1.5-1.5-1.5zm-8.5-.8c0-1.1.9-2 2-2s2 .9 2 2V8h-4v-.8zm2.8 10.8c-2 0-3.2-1-3.2-2.3 0-1.5 1.4-1.9 2.3-2.1.8-.2 1.3-.3 1.3-.8 0-.3-.3-.6-.9-.6-.7 0-1.4.3-2 .8l-.7-1c.8-.6 1.8-.9 2.7-.9 1.9 0 3 1 3 2.3 0 1.4-1.2 1.9-2.2 2.1-.8.2-1.4.3-1.4.8 0 .4.4.7 1 .7.8 0 1.6-.3 2.2-.8l.6 1c-.8.6-1.8.9-2.7.9z" fill="#FFFFFF"/>

      <!-- X (Twitter) -->

        <svg viewBox="0 0 24 24" fill="none">
          <rect width="24" height="24" rx="5" fill="#000000"/>
          <path d="M16.9 5.5h2.4l-5.3 6.1 6.2 8.3h-4.8l-3.8-5-4.3 5H4.8l5.7-6.5L4.5 5.5h4.9l3.4 4.6 3.5-4.6zm-.8 13.1h1.3L8.3 6.9H6.9l9.2 11.7z" fill="#FFFFFF"/>

    <!-- Main Card -->
    <div class="card">
      <div class="input-wrapper">
        <input type="url" id="urlInput" placeholder="I-paste ang link ng video dito..." autocomplete="off">
        <button class="btn-paste" id="btnPaste">
          <span>📋</span> Paste
        </button>
      </div>

      <div class="section-title">Pumili ng Format</div>
      <div class="formats">
        <button class="format-btn active" data-format="best">
          🎬 Best MP4
          <span>HD Video+Audio</span>
        </button>
        <button class="format-btn" data-format="720p">
          ⚡ 720p Fast
          <span>Mabilis idownload</span>
        </button>
        <button class="format-btn" data-format="mp3">
          🎵 MP3 Audio
          <span>Tugtog / Sounds</span>
        </button>
      </div>

      <button class="btn-download" id="btnDownload">
        ⬇️ Download Video sa Phone
      </button>

      <!-- Live Download Progress Box -->
      <div class="progress-card" id="progressCard">
        <div class="progress-header">
          <div class="progress-title" id="pTitle">Preparing download...</div>
          <div class="progress-pct" id="pPct">0%</div>
        </div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="pFill"></div>
        </div>
        <div class="progress-footer">
          <span id="pStatus">Connecting to engine...</span>
          <span id="pSpeed">-- MB/s</span>
        </div>
        <a id="btnSavePhone" class="btn-save-phone" href="#" download>
          💾 I-Save ang Video sa Phone
        </a>
      </div>
    </div>

  <script>
    let selectedFormat = 'best';
    const urlInput = document.getElementById('urlInput');
    const btnPaste = document.getElementById('btnPaste');
    const btnDownload = document.getElementById('btnDownload');
    const progressCard = document.getElementById('progressCard');
    const pTitle = document.getElementById('pTitle');
    const pPct = document.getElementById('pPct');
    const pFill = document.getElementById('pFill');
    const pStatus = document.getElementById('pStatus');
    const pSpeed = document.getElementById('pSpeed');
    const btnSavePhone = document.getElementById('btnSavePhone');

    // Format selection
    document.querySelectorAll('.format-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.format-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedFormat = btn.getAttribute('data-format');
      });
    });

    // Detect platform and highlight chip
    function detectPlatform(url) {
      document.querySelectorAll('.plat-chip').forEach(c => c.classList.remove('active'));
      const u = (url || '').toLowerCase();
      if (u.includes('tiktok.com')) document.getElementById('chip-tiktok').classList.add('active');
      else if (u.includes('facebook.com') || u.includes('fb.watch') || u.includes('fb.com')) document.getElementById('chip-fb').classList.add('active');
      else if (u.includes('instagram.com')) document.getElementById('chip-ig').classList.add('active');
      else if (u.includes('youtube.com') || u.includes('youtu.be')) document.getElementById('chip-yt').classList.add('active');
      else if (u.includes('threads.net') || u.includes('threads.com')) document.getElementById('chip-threads').classList.add('active');
      else if (u.includes('twitter.com') || u.includes('x.com')) document.getElementById('chip-x').classList.add('active');
      else if (u.includes('shopee.') || u.includes('shp.ee')) document.getElementById('chip-shopee').classList.add('active');
    }
    urlInput.addEventListener('input', () => detectPlatform(urlInput.value));

    // Clicking a platform chip focuses the input
    document.querySelectorAll('.plat-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        urlInput.focus();
      });
    });

    // Clipboard Paste
    btnPaste.addEventListener('click', async () => {
      try {
        if (navigator.clipboard && navigator.clipboard.readText) {
          const text = await navigator.clipboard.readText();
          if (text) {
            urlInput.value = text.trim();
            detectPlatform(text);
          }
        } else {
          urlInput.focus();
        }
      } catch (e) {
        urlInput.focus();
      }
    });

    // Download trigger
    btnDownload.addEventListener('click', async () => {
      const url = urlInput.value.trim();
      if (!url) {
        alert('Mangyaring mag-paste ng valid link.');
        return;
      }

      btnDownload.disabled = true;
      btnDownload.innerText = '⏳ Inihahanda ang Video...';
      progressCard.style.display = 'block';
      btnSavePhone.style.display = 'none';
      pFill.style.width = '0%';
      pPct.innerText = '0%';
      pTitle.innerText = 'Kinokonekta ang engine...';
      pStatus.innerText = 'Ina-analyze ang link...';
      pSpeed.innerText = '-- MB/s';

      try {
        const res = await fetch('/api/download', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url: url, format: selectedFormat })
        });
        const data = await res.json();
        if (!data.id) {
          throw new Error(data.error || 'Nabigong simulan ang download.');
        }

        // Start polling progress
        pollTask(data.id);
      } catch (err) {
        alert('Error: ' + err.message);
        btnDownload.disabled = false;
        btnDownload.innerText = '⬇️ Download Video sa Phone';
      }
    });

    function pollTask(taskId) {
      const timer = setInterval(async () => {
        try {
          const res = await fetch('/api/status?id=' + taskId);
          const data = await res.json();

          if (data.title) pTitle.innerText = data.title;
          if (data.percent != null) {
            pPct.innerText = Math.round(data.percent) + '%';
            pFill.style.width = Math.round(data.percent) + '%';
          }
          if (data.speed) pSpeed.innerText = data.speed;
          if (data.status) pStatus.innerText = data.status;

          if (data.status === 'Completed') {
            clearInterval(timer);
            btnDownload.disabled = false;
            btnDownload.innerText = '⬇️ Download Video sa Phone';
            pPct.innerText = '100%';
            pFill.style.width = '100%';
            pStatus.innerText = 'Tapos na! Handa na i-save sa Phone.';
            pSpeed.innerText = data.size || '';

            if (data.fileUrl) {
              btnSavePhone.href = data.fileUrl;
              btnSavePhone.download = data.filename || 'video.mp4';
              btnSavePhone.style.display = 'flex';

              // Auto-trigger browser download on phone
              const a = document.createElement('a');
              a.href = data.fileUrl;
              a.download = data.filename || 'video.mp4';
              document.body.appendChild(a);
              a.click();
              document.body.removeChild(a);
            }
          } else if (data.status === 'Error') {
            clearInterval(timer);
            btnDownload.disabled = false;
            btnDownload.innerText = '⬇️ Download Video sa Phone';
            pStatus.innerText = 'Nabigo: ' + (data.error || 'Unknown error');
            pFill.style.backgroundColor = '#ef4444';
          }
        } catch (e) {
          console.error(e);
        }
      }, 1000);
    }

    // Ping check
    async function checkPing() {
      try {
        const res = await fetch('/api/ping');
        if (res.ok) {
          document.getElementById('netStatus').innerHTML = '<div class="dot"></div><span>Connected to PC</span>';
        }
      } catch (e) {
        document.getElementById('netStatus').innerHTML = '<div class="dot" style="background:#ef4444;box-shadow:0 0 8px #ef4444"></div><span style="color:#f87171">Reconnecting...</span>';
      }
    }
    setInterval(checkPing, 5000);
    checkPing();
  </script>
</body>
</html>
